# ============================================================================
# MCP Server Manager RBAC
# ============================================================================
# Operator-requested full cluster administration for this service account.
# This is credential-level access, not authorization for an Agent to bypass
# its tool allowlist or approval workflow. Revert wildcard rules to restrict it.
# ============================================================================

apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcp-server-manager
  namespace: mcp
  labels:
    app: mcp-server-manager

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mcp-server-manager-cluster-role
  labels:
    app: mcp-server-manager
rules:
  # Operator-requested cluster administration. Agent tool policy and approval
  # remain separate; this credential can administer all Kubernetes resources.
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]
  - nonResourceURLs: ["*"]
    verbs: ["*"]
  - apiGroups: [""]
    resources:
      - secrets
      - pods
      - pods/log
      - pods/status
      - services
      - endpoints
      - configmaps
      - persistentvolumeclaims
      - serviceaccounts
      - events
      - namespaces
      - persistentvolumes
      - nodes
      - nodes/status
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources:
      - deployments
      - deployments/status
      - daemonsets
      - daemonsets/status
      - replicasets
      - replicasets/status
      - statefulsets
      - statefulsets/status
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources:
      - jobs
      - jobs/status
      - cronjobs
      - cronjobs/status
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources:
      - ingresses
      - ingresses/status
      - networkpolicies
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling"]
    resources:
      - horizontalpodautoscalers
      - horizontalpodautoscalers/status
    verbs: ["get", "list", "watch"]
  - apiGroups: ["policy"]
    resources:
      - poddisruptionbudgets
      - poddisruptionbudgets/status
    verbs: ["get", "list", "watch"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources:
      - roles
      - rolebindings
      - clusterroles
      - clusterrolebindings
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["admissionregistration.k8s.io"]
    resources:
      - validatingwebhookconfigurations
      - mutatingwebhookconfigurations
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mcp-server-manager-cluster-binding
  labels:
    app: mcp-server-manager
subjects:
  - kind: ServiceAccount
    name: mcp-server-manager
    namespace: mcp
roleRef:
  kind: ClusterRole
  name: mcp-server-manager-cluster-role
  apiGroup: rbac.authorization.k8s.io

---
# `create` here opens an exec subresource connection to an existing Pod. It
# does not grant `create` on the `pods` resource itself.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mcp-server-manager-observability-exec
  namespace: monitor
  labels:
    app: mcp-server-manager
rules:
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mcp-server-manager-observability-exec
  namespace: monitor
  labels:
    app: mcp-server-manager
subjects:
  - kind: ServiceAccount
    name: mcp-server-manager
    namespace: mcp
roleRef:
  kind: Role
  name: mcp-server-manager-observability-exec
  apiGroup: rbac.authorization.k8s.io
