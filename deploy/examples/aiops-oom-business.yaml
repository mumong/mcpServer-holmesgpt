apiVersion: v1
kind: Namespace
metadata:
  name: aiops-temp
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: aiops-oom-business-script
  namespace: aiops-temp
data:
  app.py: |
    import http.server
    import os
    import threading
    import time

    chunks = []
    chunk_mib = int(os.getenv("CHUNK_MIB", "4"))
    interval = float(os.getenv("ALLOC_INTERVAL_SECONDS", "1.5"))

    class Handler(http.server.BaseHTTPRequestHandler):
        def do_GET(self):
            body = f"allocated_chunks={len(chunks)} allocated_mib={len(chunks) * chunk_mib}\n".encode()
            self.send_response(200)
            self.send_header("Content-Type", "text/plain")
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

    def grow_memory():
        print("business api started on :8080", flush=True)
        print("starting controlled in-container memory growth", flush=True)
        while True:
            chunks.append(bytearray(chunk_mib * 1024 * 1024))
            print(
                f"allocated business cache chunk={len(chunks)} approx_mib={len(chunks) * chunk_mib}",
                flush=True,
            )
            time.sleep(interval)

    threading.Thread(target=grow_memory, daemon=True).start()
    http.server.ThreadingHTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
---
apiVersion: v1
kind: Pod
metadata:
  name: aiops-oom-business
  namespace: aiops-temp
  labels:
    app: aiops-oom-business
    aiops.case/type: oomkilled
spec:
  restartPolicy: Always
  containers:
    - name: business-api
      image: python:3.11-slim
      imagePullPolicy: IfNotPresent
      command: ["python", "/app/app.py"]
      env:
        - name: CHUNK_MIB
          value: "4"
        - name: ALLOC_INTERVAL_SECONDS
          value: "1.5"
      ports:
        - containerPort: 8080
          name: http
      resources:
        requests:
          cpu: "50m"
          memory: "64Mi"
        limits:
          cpu: "500m"
          memory: "96Mi"
      volumeMounts:
        - name: app
          mountPath: /app
  volumes:
    - name: app
      configMap:
        name: aiops-oom-business-script
---
apiVersion: v1
kind: Service
metadata:
  name: aiops-oom-business
  namespace: aiops-temp
  labels:
    app: aiops-oom-business
spec:
  selector:
    app: aiops-oom-business
  ports:
    - name: http
      port: 8080
      targetPort: http

