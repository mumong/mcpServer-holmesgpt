# Generated from deploy/configmap.yaml for the three-cluster env (specs/008-multi-cluster).
apiVersion: v1
kind: ConfigMap
metadata:
  name: mcp-config
  namespace: mcp
  labels:
    app: mcp-server-manager
data:
  mcp_config.yaml: |
    # ============================================================
    # 第三方 MCP 包
    # ============================================================
    customermcp: []
    basicmcp:
      - name: aiops-observability-query
        path: "servers/aiops_observability_query_server.py"
        port: 8100
        enabled: true
        env:
          PROMETHEUS_URL: "http://vmselect-vm-victoria-metrics-k8s-stack.monitor.svc:8481/select/0/prometheus"
          DEEPFLOW_CLICKHOUSE_DATABASE: "flow_log"
          AIOPS_ES_EXEC_NAMESPACE: "monitor"
          AIOPS_ES_SECRET_NAMESPACE: "monitor"
          AIOPS_CLICKHOUSE_EXEC_NAMESPACE: "monitor"
          AIOPS_TEMPO_EXEC_NAMESPACE: "monitor"
      - name: helm-tools
        path: "servers/helm_server.py"
        port: 8092
        enabled: true
      
      # K8s 只读：Holmes kubernetes/core 风格工具（kubectl describe/get/events/jq/top/lineage 等）
      - name: k8s-core
        path: "servers/k8s_core_server.py"
        port: 8093
        enabled: true
      - name: bash_command
        path: "servers/bash_server.py"
        port: 8094
        enabled: true
        # 黑名单：只填敏感命令名，逗号分隔即可（可选；不填则使用内置危险命令黑名单）
        env:
          # 与 robusta workflow.remediation.denied_executables 保持同一份核心危险命令名单
          BASH_BLOCKED_COMMANDS: "rm,dd,mkfs,fdisk,sfdisk,parted,wipefs,blkdiscard,shred,reboot,halt,poweroff,shutdown"
      - name: prometheus
        path: "servers/prometheus_server.py"
        port: 8095
        enabled: true
        env:
          PROMETHEUS_URL: "http://vmselect-vm-victoria-metrics-k8s-stack.monitor.svc:8481/select/0/prometheus"
      - name: core-investigation
        path: "servers/core_investigation_server.py"
        port: 8098
        enabled: true
